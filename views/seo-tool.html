<!doctype html>
<html lang="en-IN">
<head>
<!--#include head-->
</head>
<body>
<!--#include header-->
<main id="main">

<section class="tl-hero small">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> / <a href="/seo-tools">SEO Tools</a> / {{tool.name}}</nav>
    <a class="eyebrow" href="/seo-tools#{{tool.catId}}" style="text-decoration:none">{{tool.cat}} · Free Tool</a>
    <h1>{{tool.h1}}</h1>
    <p class="lede">{{tool.intro}}</p>
    <form class="tl-form" id="toolForm" data-tool="{{tool.slug}}" novalidate>{{tool.form}}</form>
    <div class="tl-err" id="toolErr" role="alert" hidden></div>
  </div>
</section>

<section class="section tl-result-sec" id="toolResult" hidden aria-live="polite">
  <div class="wrap">
    <div id="toolOut"></div>
  </div>
</section>

{{tool.content}}

<section class="section tint" aria-labelledby="rel-tools-title">
  <div class="wrap">
    <div class="split-head reveal">
      <div class="sec-head">
        <span class="eyebrow">Complementary tools</span>
        <h2 id="rel-tools-title">Related Free SEO Tools</h2>
      </div>
      <p><a href="/seo-tools">Explore all {{tools.live}} free tools →</a></p>
    </div>
    <div class="tl-grid related">{{tool.related}}</div>
  </div>
</section>
</main>
<!--#include footer-->
<script type="module" src="/js/tools.js"></script>
</body>
</html>
