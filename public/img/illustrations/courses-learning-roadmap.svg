<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="system-ui,Segoe UI,Arial,sans-serif">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0866FF"/><stop offset="1" stop-color="#805BFF"/></linearGradient></defs>
<style>.r{fill:none;stroke:url(#g);stroke-width:5;stroke-linecap:round;stroke-dasharray:10 12;animation:d 2s linear infinite}@keyframes d{to{stroke-dashoffset:-44}}
