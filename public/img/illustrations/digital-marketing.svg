<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif">
  <title>Digital marketing illustration: a social media ad on a phone and a campaign performance dashboard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFF"/><stop offset="1" stop-color="#EAF3FF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0066FF"/><stop offset="1" stop-color="#00A8FF"/></linearGradient>
    <linearGradient id="grow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C9B7"/><stop offset="1" stop-color="#35D07F"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0066FF" stop-opacity=".25"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B3A75" flood-opacity=".16"/></filter>
  </defs>
  <rect width="640" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="80" fill="#6B4EE6" opacity=".07"/>

  <!-- dashboard card -->
  <g filter="url(#sh)"><rect x="250" y="56" width="340" height="230" rx="18" fill="#fff"/></g>
  <text x="274" y="92" font-size="15" font-weight="700" fill="#071A2B">Campaign performance</text>
  <rect x="510" y="76" width="58" height="22" rx="11" fill="#E3F8EC"/>
  <text x="539" y="91" font-size="11" font-weight="700" fill="#138A57" text-anchor="middle">LIVE</text>
  <g stroke="#EEF2F6" stroke-width="1.5"><path d="M274 140 H566 M274 180 H566 M274 220 H566 M274 260 H566"/></g>
  <path d="M274 246 C310 238 330 214 362 216 S414 186 444 180 S500 138 566 120 V262 H274 Z" fill="url(#area)"/>
  <path d="M274 246 C310 238 330 214 362 216 S414 186 444 180 S500 138 566 120" stroke="#0066FF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M274 256 C320 252 350 240 390 236 S470 214 566 196" stroke="#00C9B7" stroke-width="3" fill="none" stroke-dasharray="6 6" stroke-linecap="round"/>
  <circle cx="566" cy="120" r="7" fill="#fff" stroke="#0066FF" stroke-width="3.5"/>
  <g font-size="11" fill="#526273" font-weight="600">
    <circle cx="282" cy="276" r="4" fill="#0066FF"/><text x="292" y="280">Enquiries</text>
    <circle cx="372" cy="276" r="4" fill="#00C9B7"/><text x="382" y="280">Cost per lead</text>
  </g>

  <!-- phone with ad -->
  <g filter="url(#sh)"><rect x="70" y="40" width="170" height="320" rx="28" fill="#071A2B"/></g>
  <rect x="80" y="52" width="150" height="296" rx="20" fill="#fff"/>
  <rect x="134" y="60" width="42" height="7" rx="3.5" fill="#DCE5EC"/>
  <circle cx="102" cy="88" r="11" fill="url(#blue)"/>
  <rect x="120" y="80" width="64" height="7" rx="3.5" fill="#071A2B"/>
  
  <text x="120" y="106" font-size="8" fill="#8A98A8" font-weight="600">Sponsored</text>
  <rect x="90" y="110" width="130" height="120" rx="12" fill="url(#blue)"/>
  <circle cx="190" cy="140" r="22" fill="#fff" opacity=".18"/>
  <rect x="104" y="180" width="80" height="10" rx="5" fill="#fff"/>
  <rect x="104" y="198" width="56" height="8" rx="4" fill="#fff" opacity=".7"/>
  <rect x="90" y="242" width="130" height="30" rx="10" fill="#071A2B"/>
  <text x="155" y="262" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Book now</text>
  <g fill="none" stroke="#526273" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 292c0-5 6-7 9-2 3-5 9-3 9 2 0 6-9 10-9 10s-9-4-9-10Z"/>
    <path d="M132 286h16v11h-9l-5 4v-4h-2z"/>
    <path d="M162 292l14-6-4 14-3-5z"/>
  </g>
  <rect x="90" y="314" width="100" height="7" rx="3.5" fill="#DCE5EC"/>

  <!-- target badge -->
  <g filter="url(#sh)"><rect x="456" y="300" width="150" height="76" rx="18" fill="#fff"/></g>
  <circle cx="494" cy="338" r="22" fill="none" stroke="#EEF2F6" stroke-width="6"/>
  <circle cx="494" cy="338" r="13" fill="none" stroke="url(#grow)" stroke-width="6"/>
  <circle cx="494" cy="338" r="4" fill="#071A2B"/>
  <text x="526" y="333" font-size="12" font-weight="700" fill="#071A2B">Right</text>
  <text x="526" y="349" font-size="12" font-weight="700" fill="#071A2B">audience</text>
</svg>
