<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif">
  <title>Example layout of the Click2Client Media SEO audit dashboard: overall score, category scores, prioritised issues and roadmap</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF3FF"/><stop offset="1" stop-color="#E9FBF7"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0066FF"/><stop offset="1" stop-color="#00A8FF"/></linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9B7"/><stop offset="1" stop-color="#0066FF"/></linearGradient>
    <linearGradient id="grow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9B7"/><stop offset="1" stop-color="#35D07F"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B3A75" flood-opacity=".16"/></filter>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B3A75" flood-opacity=".08"/></filter>
  </defs>
  <rect width="960" height="600" rx="28" fill="url(#bg)"/>

  <!-- app window -->
  <g filter="url(#sh)"><rect x="40" y="40" width="880" height="520" rx="20" fill="#F8FAFC"/></g>
  <path d="M40 60a20 20 0 0 1 20-20h840a20 20 0 0 1 20 20v26H40z" fill="#fff"/>
  <circle cx="64" cy="63" r="6" fill="#FF6B5E"/><circle cx="84" cy="63" r="6" fill="#FFC145"/><circle cx="104" cy="63" r="6" fill="#35D07F"/>
  <rect x="300" y="54" width="360" height="18" rx="9" fill="#F1F6FA"/>
  <text x="480" y="67" font-size="11" fill="#8A98A8" text-anchor="middle">SEO Audit Report · yourbusiness.in</text>

  <!-- sidebar -->
  <rect x="40" y="86" width="170" height="474" fill="#fff"/>
  <rect x="40" y="86" width="1" height="474" fill="#DCE5EC"/>
  <rect x="58" y="108" width="134" height="30" rx="8" fill="#E8F1FF"/>
  <rect x="70" y="119" width="76" height="8" rx="4" fill="#0066FF"/>
  <g fill="#C9D6E2">
    <rect x="70" y="160" width="90" height="8" rx="4"/><rect x="70" y="188" width="70" height="8" rx="4"/><rect x="70" y="216" width="96" height="8" rx="4"/>
    <rect x="70" y="244" width="64" height="8" rx="4"/><rect x="70" y="272" width="84" height="8" rx="4"/><rect x="70" y="300" width="76" height="8" rx="4"/>
    <rect x="70" y="328" width="92" height="8" rx="4"/><rect x="70" y="356" width="60" height="8" rx="4"/>
  </g>
  <g><circle cx="178" cy="164" r="4" fill="#C9302C"/><circle cx="178" cy="192" r="4" fill="#E6A019"/><circle cx="178" cy="220" r="4" fill="#138A57"/><circle cx="178" cy="248" r="4" fill="#E6A019"/><circle cx="178" cy="276" r="4" fill="#138A57"/></g>

  <!-- score card -->
  <g filter="url(#sh2)"><rect x="232" y="108" width="240" height="220" rx="16" fill="#fff"/></g>
  <text x="352" y="138" font-size="12" font-weight="700" fill="#8A98A8" text-anchor="middle" letter-spacing="1.5">OVERALL SEO SCORE</text>
  <path d="M282 262 A70 70 0 0 1 422 262" fill="none" stroke="#EEF2F6" stroke-width="18" stroke-linecap="round"/>
  <path d="M282 262 A70 70 0 0 1 404 215" fill="none" stroke="url(#gauge)" stroke-width="18" stroke-linecap="round"/>
  <text x="342" y="252" font-size="40" font-weight="800" fill="#071A2B" text-anchor="middle" letter-spacing="-1">XX</text>
  <text x="400" y="252" font-size="14" font-weight="700" fill="#8A98A8" text-anchor="middle">/100</text>
  <rect x="300" y="286" width="104" height="22" rx="11" fill="#E3F8EC"/>
  <text x="352" y="301" font-size="11" font-weight="700" fill="#138A57" text-anchor="middle">VERIFIED DATA</text>

  <!-- category bars -->
  <g filter="url(#sh2)"><rect x="488" y="108" width="412" height="220" rx="16" fill="#fff"/></g>
  <text x="510" y="140" font-size="14" font-weight="700" fill="#071A2B">Score by category</text>
  <g font-size="12" fill="#526273" font-weight="600">
    <text x="510" y="176">Technical SEO</text><text x="510" y="210">On-Page SEO</text><text x="510" y="244">Performance</text><text x="510" y="278">Mobile</text><text x="510" y="312">Internal links</text>
  </g>
  <g>
    <rect x="620" y="168" width="256" height="10" rx="5" fill="#EEF2F6"/><rect x="620" y="168" width="220" height="10" rx="5" fill="url(#grow)"/>
    <rect x="620" y="202" width="256" height="10" rx="5" fill="#EEF2F6"/><rect x="620" y="202" width="150" height="10" rx="5" fill="#E6A019"/>
    <rect x="620" y="236" width="256" height="10" rx="5" fill="#EEF2F6"/><rect x="620" y="236" width="182" height="10" rx="5" fill="url(#blue)"/>
    <rect x="620" y="270" width="256" height="10" rx="5" fill="#EEF2F6"/><rect x="620" y="270" width="236" height="10" rx="5" fill="url(#grow)"/>
    <rect x="620" y="304" width="256" height="10" rx="5" fill="#EEF2F6"/><rect x="620" y="304" width="110" height="10" rx="5" fill="#C9302C" opacity=".85"/>
  </g>

  <!-- issues list -->
  <g filter="url(#sh2)"><rect x="232" y="346" width="432" height="194" rx="16" fill="#fff"/></g>
  <text x="254" y="378" font-size="14" font-weight="700" fill="#071A2B">Prioritised issues</text>
  <g font-size="12.5" fill="#071A2B" font-weight="600">
    <rect x="254" y="394" width="388" height="30" rx="8" fill="#F8FAFC" stroke="#DCE5EC"/>
    <text x="270" y="413">Page blocked by noindex</text>
    <rect x="562" y="400" width="68" height="18" rx="9" fill="#FDE7E6"/><text x="596" y="413" font-size="10" fill="#C9302C" text-anchor="middle" font-weight="800">CRITICAL</text>
    <rect x="254" y="430" width="388" height="30" rx="8" fill="#F8FAFC" stroke="#DCE5EC"/>
    <text x="270" y="449">Missing meta description</text>
    <rect x="562" y="436" width="68" height="18" rx="9" fill="#FFEBDD"/><text x="596" y="449" font-size="10" fill="#B85300" text-anchor="middle" font-weight="800">HIGH</text>
    <rect x="254" y="466" width="388" height="30" rx="8" fill="#F8FAFC" stroke="#DCE5EC"/>
    <text x="270" y="485">Images without ALT text</text>
    <rect x="562" y="472" width="68" height="18" rx="9" fill="#FFF3D9"/><text x="596" y="485" font-size="10" fill="#A86A00" text-anchor="middle" font-weight="800">MEDIUM</text>
    <rect x="254" y="502" width="388" height="30" rx="8" fill="#F8FAFC" stroke="#DCE5EC"/>
    <text x="270" y="521">Title tag slightly long</text>
    <rect x="562" y="508" width="68" height="18" rx="9" fill="#E3F7EC"/><text x="596" y="521" font-size="10" fill="#138A57" text-anchor="middle" font-weight="800">LOW</text>
  </g>

  <!-- roadmap -->
  <g filter="url(#sh2)"><rect x="680" y="346" width="220" height="194" rx="16" fill="#071A2B"/></g>
  <text x="702" y="378" font-size="14" font-weight="700" fill="#fff">30-day roadmap</text>
  <g font-size="12" font-weight="600" fill="#D3E0EC">
    <circle cx="712" cy="408" r="9" fill="url(#grow)"/><path d="m708 408 3 3 5-6" stroke="#071A2B" stroke-width="2" fill="none"/><text x="730" y="412">Week 1 · Visibility</text>
    <circle cx="712" cy="442" r="9" fill="url(#grow)"/><path d="m708 442 3 3 5-6" stroke="#071A2B" stroke-width="2" fill="none"/><text x="730" y="446">Week 2 · Technical</text>
    <circle cx="712" cy="476" r="9" fill="none" stroke="#5BD8C9" stroke-width="2"/><text x="730" y="480">Week 3 · Content</text>
    <circle cx="712" cy="510" r="9" fill="none" stroke="#3B5774" stroke-width="2"/><text x="730" y="514" fill="#8FA5BB">Week 4 · Growth</text>
  </g>
</svg>
