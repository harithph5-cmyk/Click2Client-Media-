<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif">
  <title>Consultation illustration: a WhatsApp conversation with Click2Client Media and a scheduled strategy call</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7F9F0"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0066FF"/><stop offset="1" stop-color="#00A8FF"/></linearGradient>
    <linearGradient id="grow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C9B7"/><stop offset="1" stop-color="#35D07F"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B3A75" flood-opacity=".15"/></filter>
  </defs>
  <rect width="640" height="480" rx="26" fill="url(#bg)"/>
  <circle cx="560" cy="400" r="110" fill="#fff" opacity=".4"/>

  <!-- chat window -->
  <g filter="url(#sh)"><rect x="40" y="40" width="340" height="400" rx="22" fill="#fff"/></g>
  <path d="M40 62a22 22 0 0 1 22-22h296a22 22 0 0 1 22 22v40H40z" fill="#075E54"/>
  <circle cx="74" cy="72" r="16" fill="#fff"/>
  <path d="M66 72a8 8 0 1 1 8 8" stroke="#0066FF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="100" y="69" font-size="14" font-weight="700" fill="#fff">Click2Client Media</text>
  <text x="100" y="86" font-size="11" fill="#CFE9E4">online</text>
  <rect x="40" y="102" width="340" height="338" fill="#F3EFE8"/>
  <path d="M40 418h340v0a22 22 0 0 1-22 22H62a22 22 0 0 1-22-22z" fill="#F3EFE8"/>
  <!-- messages -->
  <rect x="160" y="122" width="200" height="54" rx="12" fill="#D9FDD3"/>
  <text x="174" y="144" font-size="12" fill="#071A2B">Hi! My website isn't getting</text>
  <text x="174" y="162" font-size="12" fill="#071A2B">enquiries. Can you help?</text>
  <rect x="58" y="190" width="220" height="72" rx="12" fill="#fff"/>
  <text x="72" y="212" font-size="12" fill="#071A2B">Of course. Let's start with a</text>
  <text x="72" y="230" font-size="12" fill="#071A2B">free SEO audit of your site, then</text>
  <text x="72" y="248" font-size="12" fill="#071A2B">a quick strategy call.</text>
  <rect x="58" y="276" width="220" height="64" rx="12" fill="#fff"/>
  <rect x="68" y="286" width="200" height="44" rx="8" fill="#E8F1FF"/>
  <rect x="78" y="296" width="24" height="24" rx="6" fill="url(#blue)"/>
  <text x="112" y="306" font-size="11" font-weight="700" fill="#071A2B">SEO Audit Report</text>
  <text x="112" y="322" font-size="10" fill="#526273">Issues · fixes · roadmap</text>
  <rect x="220" y="354" width="140" height="36" rx="12" fill="#D9FDD3"/>
  <text x="234" y="377" font-size="12" fill="#071A2B">Perfect, thank you!</text>
  <rect x="56" y="402" width="270" height="26" rx="13" fill="#fff"/>
  <circle cx="352" cy="415" r="15" fill="#25D366"/>
  <path d="M346 415h12m-4-4 4 4-4 4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- calendar -->
  <g filter="url(#sh)"><rect x="380" y="96" width="220" height="214" rx="20" fill="#fff"/></g>
  <path d="M380 116a20 20 0 0 1 20-20h180a20 20 0 0 1 20 20v26H380z" fill="url(#blue)"/>
  <text x="490" y="125" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Strategy call</text>
  <g fill="#C9D6E2">
    <circle cx="414" cy="168" r="4"/><circle cx="444" cy="168" r="4"/><circle cx="474" cy="168" r="4"/><circle cx="504" cy="168" r="4"/><circle cx="534" cy="168" r="4"/><circle cx="564" cy="168" r="4"/>
    <circle cx="414" cy="198" r="4"/><circle cx="444" cy="198" r="4"/><circle cx="474" cy="198" r="4"/><circle cx="534" cy="198" r="4"/><circle cx="564" cy="198" r="4"/>
    <circle cx="414" cy="228" r="4"/><circle cx="444" cy="228" r="4"/><circle cx="474" cy="228" r="4"/><circle cx="504" cy="228" r="4"/><circle cx="534" cy="228" r="4"/><circle cx="564" cy="228" r="4"/>
  </g>
  <circle cx="504" cy="198" r="15" fill="url(#grow)"/>
  <path d="m497 198 5 5 9-10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="252" width="180" height="40" rx="12" fill="#F1F6FA"/>
  <circle cx="422" cy="272" r="9" fill="none" stroke="#0066FF" stroke-width="2.4"/>
  <path d="M422 267v5l3 2" stroke="#0066FF" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <rect x="440" y="266" width="110" height="9" rx="4.5" fill="#071A2B"/>

  <!-- call badge -->
  <g filter="url(#sh)"><rect x="420" y="336" width="180" height="70" rx="18" fill="#fff"/></g>
  <circle cx="454" cy="371" r="18" fill="#E8F1FF"/>
  <path d="M462 377v3a2 2 0 0 1-2.2 2 16 16 0 0 1-12-12A2 2 0 0 1 450 368h3a2 2 0 0 1 2 1.6l.5 2.4-1.6 1.6a10 10 0 0 0 4.5 4.5l1.6-1.6 2.4.5a2 2 0 0 1 1.6 2Z" fill="#0066FF"/>
  <text x="482" y="366" font-size="12.5" font-weight="700" fill="#071A2B">Talk to a</text>
  <text x="482" y="383" font-size="12.5" font-weight="700" fill="#071A2B">specialist</text>
</svg>
