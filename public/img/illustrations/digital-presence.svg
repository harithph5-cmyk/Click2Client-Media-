<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif">
  <title>Digital presence illustration: a business website on laptop and phone, found on search and receiving enquiries</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4EFFF"/><stop offset="1" stop-color="#E3F9F4"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0066FF"/><stop offset="1" stop-color="#00A8FF"/></linearGradient>
    <linearGradient id="grow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C9B7"/><stop offset="1" stop-color="#35D07F"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00C9B7" stop-opacity=".3"/><stop offset="1" stop-color="#00C9B7" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B3A75" flood-opacity=".16"/></filter>
  </defs>
  <rect width="720" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="610" cy="90" r="120" fill="#fff" opacity=".45"/>
  <circle cx="120" cy="470" r="110" fill="#fff" opacity=".35"/>

  <!-- laptop -->
  <g filter="url(#sh)">
    <rect x="110" y="120" width="440" height="280" rx="18" fill="#071A2B"/>
  </g>
  <rect x="124" y="134" width="412" height="252" rx="8" fill="#fff"/>
  <path d="M70 400h520l-26 26H96z" fill="#C9D6E2"/>
  <rect x="290" y="400" width="80" height="8" rx="4" fill="#A9B8C8"/>
  <!-- analytics on screen -->
  <rect x="144" y="152" width="90" height="10" rx="5" fill="#071A2B"/>
  <rect x="144" y="168" width="60" height="7" rx="3.5" fill="#C9D6E2"/>
  <g>
    <rect x="144" y="190" width="116" height="62" rx="10" fill="#F1F6FA"/><rect x="156" y="202" width="40" height="7" rx="3.5" fill="#8A98A8"/><rect x="156" y="218" width="64" height="16" rx="5" fill="url(#blue)"/>
    <rect x="270" y="190" width="116" height="62" rx="10" fill="#F1F6FA"/><rect x="282" y="202" width="40" height="7" rx="3.5" fill="#8A98A8"/><rect x="282" y="218" width="52" height="16" rx="5" fill="url(#grow)"/>
    <rect x="396" y="190" width="120" height="62" rx="10" fill="#F1F6FA"/><rect x="408" y="202" width="40" height="7" rx="3.5" fill="#8A98A8"/><rect x="408" y="218" width="72" height="16" rx="5" fill="#071A2B"/>
  </g>
  <rect x="144" y="266" width="372" height="104" rx="10" fill="#F8FAFC" stroke="#EEF2F6"/>
  <path d="M156 352 C200 344 226 320 262 322 S330 296 366 290 S440 254 504 242 V362 H156 Z" fill="url(#area)"/>
  <path d="M156 352 C200 344 226 320 262 322 S330 296 366 290 S440 254 504 242" stroke="#00C9B7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="504" cy="242" r="7" fill="#fff" stroke="#00C9B7" stroke-width="4"/>

  <!-- phone -->
  <g filter="url(#sh)"><rect x="500" y="200" width="150" height="290" rx="26" fill="#071A2B"/></g>
  <rect x="510" y="212" width="130" height="266" rx="18" fill="#fff"/>
  <rect x="556" y="220" width="38" height="6" rx="3" fill="#DCE5EC"/>
  <rect x="522" y="240" width="52" height="8" rx="4" fill="#071A2B"/>
  <rect x="522" y="262" width="104" height="12" rx="5" fill="#071A2B"/>
  <rect x="522" y="280" width="80" height="12" rx="5" fill="#0066FF"/>
  <rect x="522" y="302" width="104" height="70" rx="10" fill="url(#blue)"/>
  <circle cx="600" cy="326" r="14" fill="#fff" opacity=".25"/>
  <rect x="522" y="384" width="104" height="26" rx="9" fill="#25D366"/>
  <text x="574" y="401" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">WhatsApp us</text>
  <rect x="522" y="420" width="104" height="26" rx="9" fill="#fff" stroke="#C9D6E2"/>
  <text x="574" y="437" font-size="11" font-weight="700" fill="#0066FF" text-anchor="middle">Call now</text>

  <!-- search card -->
  <g filter="url(#sh)"><rect x="40" y="56" width="300" height="74" rx="18" fill="#fff"/></g>
  <circle cx="74" cy="93" r="18" fill="#E8F1FF"/>
  <circle cx="72" cy="91" r="7" fill="none" stroke="#0066FF" stroke-width="2.6"/>
  <path d="m77 96 6 6" stroke="#0066FF" stroke-width="2.6" stroke-linecap="round"/>
  <text x="102" y="88" font-size="13" font-weight="700" fill="#071A2B">Found on Google</text>
  <text x="102" y="108" font-size="12" fill="#526273">People searching for you, find you</text>

  <!-- enquiry card -->
  <g filter="url(#sh)"><rect x="40" y="440" width="300" height="74" rx="18" fill="#fff"/></g>
  <circle cx="74" cy="477" r="18" fill="url(#grow)"/>
  <path d="m66 477 6 6 11-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="472" font-size="13" font-weight="700" fill="#071A2B">New enquiry received</text>
  <text x="102" y="492" font-size="12" fill="#526273">Click → Client</text>

  <!-- location pin -->
  <g filter="url(#sh)"><path d="M610 40c-22 0-40 18-40 40 0 30 40 66 40 66s40-36 40-66c0-22-18-40-40-40Z" fill="url(#blue)"/></g>
  <circle cx="610" cy="80" r="14" fill="#fff"/>
</svg>
